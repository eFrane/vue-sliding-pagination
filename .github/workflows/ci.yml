name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Enable corepack
      run: corepack enable
    - name: Install modules
      run: yarn
    - name: Lint
      run: yarn lint
    - name: Run unit tests
      run: yarn test:unit
